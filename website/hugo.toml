baseURL = 'https://tallybook-app.netlify.app/'
languageCode = 'en-us'
title = 'Tallybook'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']

[params]
CompanyName = 'Tallybook'
repoName = 'tallybook'
description = 'Bookkeeping and budgeting on your own computer. A household budget that is free for good. Yearly plans add bank sync, your business and tax prep. Stop paying and your books, and everything you unlocked, keep working.'
github = 'https://github.com/jasonsutter87/tallybook'
author = 'Jason Sutter'

# The release the download page points at. Bump on every release.
version = '0.2.0'

# tallybook.app belongs to someone else; switch baseURL when Tallybook has its own domain.

# Keep in step with the app (crates/tally-api/src/license.rs, app/src/flows/License.tsx).
[params.pricing]
personal = '$20'
business = '$49'
tax = '$75'
personalCheckout = 'https://tallybook.lemonsqueezy.com/buy/personal'
businessCheckout = 'https://tallybook.lemonsqueezy.com/buy/business'
taxCheckout = 'https://tallybook.lemonsqueezy.com/buy/business-tax'

[menus]
  [[menus.main]]
    name = 'Household'
    url = '/#household'
    weight = 10
  [[menus.main]]
    name = 'Business'
    url = '/#business'
    weight = 20
  [[menus.main]]
    name = 'Taxes'
    url = '/#taxes'
    weight = 30
  [[menus.main]]
    name = 'Pricing'
    url = '/pricing/'
    weight = 40
  [[menus.main]]
    name = 'Blog'
    url = '/blog/'
    weight = 50

[environments.development]
baseURL = 'http://localhost:1313/'

[environments.production]
baseURL = 'https://tallybook-app.netlify.app/'
