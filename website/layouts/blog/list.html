{{ define "main" }}
<section class="page-hero" aria-labelledby="page-title">
  <div class="container">
    <p class="eyebrow">Blog</p>
    <h1 id="page-title">{{ .Params.heading | default .Title }}</h1>
    <p class="page-lede">{{ .Description }}</p>
  </div>
</section>
<section class="section tight">
  <div class="container">
    <div class="post-grid">
      {{ range .Pages.ByDate.Reverse }}
        <a class="post-card" href="{{ .RelPermalink }}">
          <span class="post-topic">{{ .Params.topic }}</span>
          <h2>{{ .Title }}</h2>
          <p>{{ .Description }}</p>
          <span class="post-meta">{{ .Date.Format "January 2, 2006" }} · {{ .ReadingTime }} min read</span>
        </a>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
