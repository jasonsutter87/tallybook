# Questions shown on the home page (home: true) and the pricing page (all of them).
- q: Is the household budget really free?
  home: true
  a: >-
    Yes, for good. Budgets, bills, goals, reports, encryption and file import
    (CSV, OFX, QFX) from any bank cost nothing and never expire. You pay only if
    you want bank sync, a business side, or tax prep.

- q: Is this a subscription?
  home: true
  a: >-
    The paid plans are, yes. Personal ($20), Business ($49) and Business + Tax
    ($75) are yearly subscriptions that renew until you cancel, and each includes
    the ones below it. The free household budget never expires. Here is what
    happens if you stop paying: everything the plan unlocked keeps working,
    except bank sync and phone sync. The business side stays. Tax prep stays open
    for the tax years you already paid for. Your books are never locked, and you
    can always read and export them.

- q: What does bank sync cost?
  home: true
  a: >-
    It comes with Personal, $20 a year, and every plan above it. That covers most
    US banks and cards, through Plaid. We set it up, so you don't need your own
    keys or an account anywhere else. You just sign in to your bank. Without a
    paid plan you can still import CSV, OFX and QFX files for free.

- q: Does Tallybook see my bank password?
  home: true
  a: >-
    No. You type it into Plaid's own sign-in page, and it goes nowhere else.
    Tallybook, and the small service we run for bank sync, never see it.

- q: Do my books go to your server?
  home: true
  a: >-
    No. Your books stay in a file on your computer. Bank sync runs through
    Tallybook Connect, a small service we run. It passes your transactions
    straight to your computer and doesn't store them. It keeps, encrypted, only
    the bank access token and your license key, so it can disconnect your banks
    when a plan ends. <a href="/help/bank-connections/">How bank sync works</a>.

- q: Is there a phone app?
  a: >-
    It's planned, not built yet. It's coming to iPhone and Android and will be
    included in the paid plans when it arrives. We won't promise a date until
    there's one worth promising.

- q: Do I need an account?
  home: true
  a: >-
    No. There's nothing to sign up for, no email and no password. Your books live
    in a single file on your computer. When you buy a plan you get a license key
    by email. Paste it into Settings → License to unlock your plan. A key isn't
    an account.

- q: Where is my data stored?
  home: true
  a: >-
    In one <code>.tallybook</code> file on your computer, in Documents/Tallybook
    unless you pick somewhere else. Turn on encryption and the file is unreadable
    without your key. Cloud copies are only ever sent encrypted, to a folder or Git
    repository you choose.

- q: How do I bring in my transactions?
  a: >-
    Import a CSV or OFX/QFX file from your bank's website (always free), or
    connect your bank with Personal or above and let transactions arrive on their
    own. Cash and anything else the bank won't see can be logged by hand in a few
    taps.

- q: Does it file my taxes or run payroll?
  a: >-
    No. Tallybook keeps your books and prepares your tax numbers: a Schedule C
    worksheet, a quarterly estimate plan and 1099 tracking. It doesn't submit
    anything to the IRS or run payroll. Have a tax professional review your
    figures before you file.

- q: Who is the tax prep for?
  a: >-
    Sole proprietors and single-member LLCs that file a Schedule C with their
    personal return. It isn't built for partnerships or corporations.

- q: I already use Tallybook for my business. Do I have to pay?
  a: >-
    Books that already keep a business keep working, as they always have. Tax
    prep, bank sync, and adding a business to a book that doesn't have one, need a
    paid plan.

- q: Who handles payments?
  a: >-
    Lemon Squeezy, our reseller, takes payment and handles sales tax and VAT.
    Tallybook never sees your card details. To cancel or update a plan, use the
    <a href="https://app.lemonsqueezy.com/my-orders">Lemon Squeezy customer portal</a>.

- q: Mac, Windows or Linux?
  a: >-
    All three. Mac is the most tested so far, so please report anything odd on
    Windows or Linux on GitHub.

- q: Can I use it with Claude, ChatGPT's Codex or another AI agent?
  a: >-
    Yes. Tallybook runs as an MCP server, the open standard most agents speak, so
    Claude, OpenAI's Codex and Agents SDK, OpenClaw and others can answer
    questions about your books and, if you allow it, categorize transactions and
    plan the month. It's read-only unless you say otherwise.
    <a href="/help/agents/">Set it up</a>.

- q: Can I see the source code?
  a: >-
    Yes. It's public on <a href="https://github.com/jasonsutter87/tallybook">GitHub</a>
    under the Functional Source License: read it, build it and use it for yourself,
    just don't sell it or build a competing product with it. Each release becomes
    Apache-2.0 two years after it ships. Paying for a plan gets you the signed,
    auto-updating app and supports the work.
