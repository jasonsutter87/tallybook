name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks before building anything.
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The keychain crate talks to the Linux Secret Service over D-Bus.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The desktop shell needs WebKitGTK; the release workflow builds it.
      - run: cargo clippy --workspace --exclude tallybook-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude tallybook-desktop

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build

  # The desktop app on every platform it ships to, on every pull request, so a
  # Windows- or Mac-only break shows up here rather than when cutting a release.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: platforms-${{ matrix.os }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The desktop crate embeds the built UI, so build it first.
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: Desktop app compiles cleanly
        run: cargo clippy -p tallybook-desktop -- -D warnings
      # Linux already runs the full suite in the backend job.
      - name: Tests on this platform
        if: runner.os != 'Linux'
        run: cargo test --workspace --exclude tallybook-desktop

  # The real UI against the real backend, clicked through like a person would.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # Build the dev server first so Playwright's startup timeout only covers starting it.
      - run: cargo build -p tally-devserver
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run test:e2e
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 14
