name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks before building anything.
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The keychain crate talks to the Linux Secret Service over D-Bus.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The desktop shell needs WebKitGTK; the release workflow builds it.
      - run: cargo clippy --workspace --exclude tallybook-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude tallybook-desktop

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
