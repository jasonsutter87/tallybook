name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks before building anything.
  workflow_call:

# Read-only token: nothing in CI writes to the repository.
permissions:
  contents: read

# Every third-party action is pinned to a full commit SHA (version in the
# trailing comment); Dependabot (.github/dependabot.yml) proposes updates.
# The rust-toolchain action is pinned to the head of its `stable` branch, so
# the toolchain is named explicitly with `toolchain: stable`.

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Actions are pinned to commit SHAs
        run: |
          if grep -rnE '^[[:space:]-]*uses:' .github/workflows \
              | grep -vE 'uses:[[:space:]]*\./|@[0-9a-f]{40}([[:space:]]|$)'; then
            echo "::error::Pin every action above to a full 40-character commit SHA."
            exit 1
          fi
      - name: Admin page script is pinned with integrity
        run: |
          page=website/static/admin/index.html
          grep -q 'integrity="sha384-' "$page" || { echo "::error::$page: script tag needs an integrity attribute."; exit 1; }
          if grep -nE 'src="https://[^"]*(@[\^~]|@latest|@[0-9]+(\.[0-9]+)?/)' "$page"; then
            echo "::error::$page: pin the script URL to an exact version."
            exit 1
          fi
      # The keychain crate talks to the Linux Secret Service over D-Bus.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The desktop shell needs WebKitGTK; the release workflow builds it.
      - run: cargo clippy --workspace --exclude tallybook-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude tallybook-desktop

  # A book years deep: 10,000 entries and 2,000 waiting transactions. Every
  # screen's main call must answer within 500ms in a release build.
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: performance
      - run: cargo test --release -p tally-api --test big_book -- --ignored --nocapture

  # npm ci runs with --ignore-scripts throughout, as in the release build: no
  # dependency needs an install script (Vite/Rolldown and the Tauri CLI ship
  # prebuilt native binaries as optional packages; fsevents ships its binary
  # prebuilt; Playwright browsers are installed explicitly below).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build

  # The desktop app on every platform it ships to, on every pull request, so a
  # Windows- or Mac-only break shows up here rather than when cutting a release.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: platforms-${{ matrix.os }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The desktop crate embeds the built UI, so build it first.
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: Desktop app compiles cleanly
        run: cargo clippy -p tallybook-desktop -- -D warnings
      # Linux already runs the full suite in the backend job.
      - name: Tests on this platform
        if: runner.os != 'Linux'
        run: cargo test --workspace --exclude tallybook-desktop

  # The real UI against the real backend, clicked through like a person would.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: app
      # Build the dev server first so Playwright's startup timeout only covers starting it.
      - run: cargo build -p tally-devserver
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run test:e2e
        working-directory: app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 14
