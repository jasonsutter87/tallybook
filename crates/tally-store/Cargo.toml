[package]
name = "tally-store"
description = "SQLite persistence for Tallybook books."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
tally-core = { path = "../tally-core" }
chrono.workspace = true
serde.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
serde_json = "1"
getrandom = "0.4"
sha2 = "0.10"

[features]
# Exposes raw SQL access for integration tests only.
testing = []

[dev-dependencies]
tally-store = { path = ".", features = ["testing"] }
