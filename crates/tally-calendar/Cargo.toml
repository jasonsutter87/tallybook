[package]
name = "tally-calendar"
description = "Calendar adapters for Tallybook: sign-in (OAuth with PKCE) and bill reminders on Google Calendar and Outlook."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
chrono.workspace = true
serde.workspace = true
thiserror.workspace = true
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
