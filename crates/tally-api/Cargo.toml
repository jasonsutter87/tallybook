[package]
name = "tally-api"
description = "Tallybook application layer: one JSON method dispatcher shared by the desktop shell and the dev server."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
tally-core = { path = "../tally-core" }
tally-store = { path = "../tally-store" }
tally-feed = { path = "../tally-feed" }
tally-calendar = { path = "../tally-calendar" }
chrono.workspace = true
serde.workspace = true
thiserror.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
trash = "5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
