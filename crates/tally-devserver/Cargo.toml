[package]
name = "tally-devserver"
description = "Serves tally-api over HTTP so the UI can run in a normal browser during development."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
tally-api = { path = "../tally-api" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde_json = "1"
