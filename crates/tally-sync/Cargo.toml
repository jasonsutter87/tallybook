[package]
name = "tally-sync"
description = "Device sync for Tallybook: encrypted batches and snapshots, and the engine that trades them (see docs/SYNC.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
tally-store = { path = "../tally-store" }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
getrandom = "0.4"
# XChaCha20-Poly1305, from RustCrypto. The one new dependency sync needs: the
# server must never be able to read or alter a batch.
chacha20poly1305 = "0.10"

[dev-dependencies]
tally-store = { path = "../tally-store", features = ["testing"] }
tally-core = { path = "../tally-core" }
chrono.workspace = true
