[workspace]
resolver = "2"
members = ["crates/tally-core", "crates/tally-store", "crates/tally-feed", "crates/tally-calendar", "crates/tally-api", "crates/tally-devserver", "crates/tally-mcp", "crates/tally-connect", "crates/tally-sync", "app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "FSL-1.1-ALv2"
authors = ["Jason Sutter"]

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl", "chrono"] }

# Money math must never silently wrap, even in release builds.
[profile.release]
overflow-checks = true

# Sync encrypts every snapshot; unoptimized, the cipher makes tests of it
# crawl. Optimizing these few crates costs nothing else.
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
